name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy"
        required: true
        default: "main"
      run_seed:
        description: "Run production seed after deploy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/KirisakiRei/newmeclass.git
  DEPLOY_PATH: /opt/newme
  APP_DIR: /opt/newme/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve commit
        id: meta
        shell: bash
        run: echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Render production env file
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
          PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
          DASHBOARD_FRONTEND_URL: ${{ vars.DASHBOARD_FRONTEND_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          UPLOAD_PUBLIC_BASE_URL: ${{ vars.UPLOAD_PUBLIC_BASE_URL }}
          MIDTRANS_IS_PRODUCTION: ${{ vars.MIDTRANS_IS_PRODUCTION }}
          DISBURSEMENT_PROVIDER: ${{ vars.DISBURSEMENT_PROVIDER }}
          MIDTRANS_IRIS_SANDBOX_BASE_URL: ${{ vars.MIDTRANS_IRIS_SANDBOX_BASE_URL }}
          MIDTRANS_IRIS_PRODUCTION_BASE_URL: ${{ vars.MIDTRANS_IRIS_PRODUCTION_BASE_URL }}
          MIDTRANS_IRIS_PAYOUTS_PATH: ${{ vars.MIDTRANS_IRIS_PAYOUTS_PATH }}
          FRONTEND_PORT_RAW: ${{ vars.FRONTEND_PORT }}
          NODE_ENV: production
          PORT: 5000
          API_PREFIX: api
          APP_NAME: NEWME Backend
          TZ: Asia/Jakarta
          LOG_LEVEL: info
          TRUST_PROXY: "true"
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DB_TX_TIMEOUT_MS: 8000
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 30d
          BCRYPT_ROUNDS: 12
          RATE_LIMIT_TTL: 60
          RATE_LIMIT_LIMIT: 120
          AUTH_RATE_LIMIT_TTL: 60
          AUTH_RATE_LIMIT_REGISTER_LIMIT: 20
          AUTH_RATE_LIMIT_LOGIN_LIMIT: 20
          AUTH_RATE_LIMIT_ADMIN_LOGIN_LIMIT: 8
          AUTH_RATE_LIMIT_PASSWORD_RECOVERY_LIMIT: 8
          CERT_DOWNLOAD_RATE_LIMIT_TTL: 60
          CERT_DOWNLOAD_RATE_LIMIT: 30
          CERT_AI_DOWNLOAD_RATE_LIMIT: 20
          CERT_GENERATE_RATE_LIMIT: 15
          REDIS_HOST: redis
          REDIS_PORT: 6379
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: 0
          BULLMQ_PREFIX: newme
          BULLMQ_DEFAULT_REMOVE_ON_COMPLETE: 1000
          BULLMQ_DEFAULT_REMOVE_ON_FAIL: 5000
          QUEUE_CONCURRENCY_PAYMENT: 10
          QUEUE_CONCURRENCY_SCORING: 20
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          MIDTRANS_MERCHANT_ID: ${{ secrets.MIDTRANS_MERCHANT_ID }}
          MIDTRANS_IRIS_API_KEY: ${{ secrets.MIDTRANS_IRIS_API_KEY }}
          MIDTRANS_IRIS_SANDBOX_API_KEY: ${{ secrets.MIDTRANS_IRIS_SANDBOX_API_KEY }}
          MIDTRANS_IRIS_PRODUCTION_API_KEY: ${{ secrets.MIDTRANS_IRIS_PRODUCTION_API_KEY }}
          MIDTRANS_SANITIZED: "true"
          MIDTRANS_3DS: "true"
          MIDTRANS_WEBHOOK_PATH: /api/payments/midtrans/webhook
          PAYMENT_RECONCILE_CRON: "*/5 * * * *"
          PAYMENT_RECONCILE_WINDOW_MINUTES: 120
          STORAGE_DRIVER: local
          UPLOAD_DIR: ./uploads
          MAX_FILE_SIZE_MB: 10
          ALLOWED_IMAGE_EXT: jpg,jpeg,png,webp
          ALLOWED_DOC_EXT: pdf
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT_RAW: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_NAME: NEWME
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_SECURE: "false"
          CERT_TEMPLATE_DIR: ./uploads/certificates/templates
          CERT_OUTPUT_DIR: ./uploads/certificates/generated
          CERT_NUMBER_PREFIX: NEWME
          CERT_TIMEZONE: Asia/Jakarta
          CRON_ANALYTICS_CLEANUP: "0 */6 * * *"
          CRON_TEMP_FILES_CLEANUP: "0 3 * * *"
          SEED_SUPERADMIN_EMAIL: admin@newme.id
          SEED_SUPERADMIN_PASSWORD: ${{ secrets.SEED_SUPERADMIN_PASSWORD }}
          SEED_SUPERADMIN_NAME: Super Admin
        run: |
          FRONTEND_PORT="${FRONTEND_PORT_RAW:-80}"
          SMTP_PORT="${SMTP_PORT_RAW:-2525}"
          cat > .env.production.rendered <<EOF
          APP_URL=${APP_URL}
          PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
          DASHBOARD_FRONTEND_URL=${DASHBOARD_FRONTEND_URL}
          FRONTEND_URL=${DASHBOARD_FRONTEND_URL}
          CORS_ORIGINS=${CORS_ORIGINS}
          UPLOAD_PUBLIC_BASE_URL=${UPLOAD_PUBLIC_BASE_URL}
          FRONTEND_PORT=${FRONTEND_PORT}
          VITE_BACKEND_URL=
          VITE_DASHBOARD_URL=${DASHBOARD_FRONTEND_URL}
          NGINX_BACKEND_UPSTREAM=http://backend:5000
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          API_PREFIX=${API_PREFIX}
          APP_NAME=${APP_NAME}
          TZ=${TZ}
          LOG_LEVEL=${LOG_LEVEL}
          TRUST_PROXY=${TRUST_PROXY}
          MYSQL_DATABASE=${MYSQL_DATABASE}
          MYSQL_USER=${MYSQL_USER}
          MYSQL_PASSWORD=${MYSQL_PASSWORD}
          MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          DIRECT_URL=${DIRECT_URL}
          DB_TX_TIMEOUT_MS=${DB_TX_TIMEOUT_MS}
          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
          JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
          BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
          RATE_LIMIT_TTL=${RATE_LIMIT_TTL}
          RATE_LIMIT_LIMIT=${RATE_LIMIT_LIMIT}
          AUTH_RATE_LIMIT_TTL=${AUTH_RATE_LIMIT_TTL}
          AUTH_RATE_LIMIT_REGISTER_LIMIT=${AUTH_RATE_LIMIT_REGISTER_LIMIT}
          AUTH_RATE_LIMIT_LOGIN_LIMIT=${AUTH_RATE_LIMIT_LOGIN_LIMIT}
          AUTH_RATE_LIMIT_ADMIN_LOGIN_LIMIT=${AUTH_RATE_LIMIT_ADMIN_LOGIN_LIMIT}
          AUTH_RATE_LIMIT_PASSWORD_RECOVERY_LIMIT=${AUTH_RATE_LIMIT_PASSWORD_RECOVERY_LIMIT}
          CERT_DOWNLOAD_RATE_LIMIT_TTL=${CERT_DOWNLOAD_RATE_LIMIT_TTL}
          CERT_DOWNLOAD_RATE_LIMIT=${CERT_DOWNLOAD_RATE_LIMIT}
          CERT_AI_DOWNLOAD_RATE_LIMIT=${CERT_AI_DOWNLOAD_RATE_LIMIT}
          CERT_GENERATE_RATE_LIMIT=${CERT_GENERATE_RATE_LIMIT}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_DB=${REDIS_DB}
          BULLMQ_PREFIX=${BULLMQ_PREFIX}
          BULLMQ_DEFAULT_REMOVE_ON_COMPLETE=${BULLMQ_DEFAULT_REMOVE_ON_COMPLETE}
          BULLMQ_DEFAULT_REMOVE_ON_FAIL=${BULLMQ_DEFAULT_REMOVE_ON_FAIL}
          QUEUE_CONCURRENCY_PAYMENT=${QUEUE_CONCURRENCY_PAYMENT}
          QUEUE_CONCURRENCY_SCORING=${QUEUE_CONCURRENCY_SCORING}
          MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION}
          MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
          MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
          MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
          DISBURSEMENT_PROVIDER=${DISBURSEMENT_PROVIDER:-manual}
          MIDTRANS_IRIS_API_KEY=${MIDTRANS_IRIS_API_KEY}
          MIDTRANS_IRIS_SANDBOX_API_KEY=${MIDTRANS_IRIS_SANDBOX_API_KEY}
          MIDTRANS_IRIS_PRODUCTION_API_KEY=${MIDTRANS_IRIS_PRODUCTION_API_KEY}
          MIDTRANS_IRIS_SANDBOX_BASE_URL=${MIDTRANS_IRIS_SANDBOX_BASE_URL:-https://app.sandbox.midtrans.com/iris/api/v1}
          MIDTRANS_IRIS_PRODUCTION_BASE_URL=${MIDTRANS_IRIS_PRODUCTION_BASE_URL:-https://app.midtrans.com/iris/api/v1}
          MIDTRANS_IRIS_PAYOUTS_PATH=${MIDTRANS_IRIS_PAYOUTS_PATH:-/payouts}
          MIDTRANS_SANITIZED=${MIDTRANS_SANITIZED}
          MIDTRANS_3DS=${MIDTRANS_3DS}
          MIDTRANS_WEBHOOK_PATH=${MIDTRANS_WEBHOOK_PATH}
          PAYMENT_RECONCILE_CRON=${PAYMENT_RECONCILE_CRON}
          PAYMENT_RECONCILE_WINDOW_MINUTES=${PAYMENT_RECONCILE_WINDOW_MINUTES}
          STORAGE_DRIVER=${STORAGE_DRIVER}
          UPLOAD_DIR=${UPLOAD_DIR}
          MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB}
          ALLOWED_IMAGE_EXT=${ALLOWED_IMAGE_EXT}
          ALLOWED_DOC_EXT=${ALLOWED_DOC_EXT}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${SMTP_PASS}
          SMTP_FROM_NAME=${SMTP_FROM_NAME}
          SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
          SMTP_SECURE=${SMTP_SECURE}
          CERT_TEMPLATE_DIR=${CERT_TEMPLATE_DIR}
          CERT_OUTPUT_DIR=${CERT_OUTPUT_DIR}
          CERT_NUMBER_PREFIX=${CERT_NUMBER_PREFIX}
          CERT_TIMEZONE=${CERT_TIMEZONE}
          CRON_ANALYTICS_CLEANUP=${CRON_ANALYTICS_CLEANUP}
          CRON_TEMP_FILES_CLEANUP=${CRON_TEMP_FILES_CLEANUP}
          SEED_SUPERADMIN_EMAIL=${SEED_SUPERADMIN_EMAIL}
          SEED_SUPERADMIN_PASSWORD=${SEED_SUPERADMIN_PASSWORD}
          SEED_SUPERADMIN_NAME=${SEED_SUPERADMIN_NAME}
          EOF

      - name: Validate compose config
        shell: bash
        run: docker compose --env-file .env.production.rendered -f compose.yml config > /dev/null

      - name: Upload env file to VPS
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}" "mkdir -p '${{ env.DEPLOY_PATH }}'"
          scp .env.production.rendered "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/.env.production"

      - name: Deploy on VPS
        shell: bash
        env:
          DEPLOY_COMMIT: ${{ steps.meta.outputs.git_commit }}
          RUN_SEED: ${{ inputs.run_seed }}
        run: |
          ssh "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}" "
            set -e
            mkdir -p '${{ env.DEPLOY_PATH }}'
            if [ ! -d '${{ env.APP_DIR }}/.git' ]; then
              git clone '${{ env.REPO_URL }}' '${{ env.APP_DIR }}'
            fi
            cd '${{ env.APP_DIR }}'
            git fetch --all --tags --prune
            git checkout --force '${DEPLOY_COMMIT}'
            cp '${{ env.DEPLOY_PATH }}/.env.production' .env
            docker compose up -d --build
            if [ '${RUN_SEED}' = 'true' ]; then
              docker compose --profile ops run --rm seed
            fi
            docker image prune -f
          "
