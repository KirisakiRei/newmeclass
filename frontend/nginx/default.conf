server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=30s;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; connect-src 'self' http://localhost http://127.0.0.1 http://localhost:8080 http://127.0.0.1:8080 https:; frame-src 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; child-src 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; script-src-attr 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "clipboard-read=*, clipboard-write=*" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  client_max_body_size 20m;
  gzip on;
  gzip_static on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  location /api/ {
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ^~ /certificate-pdf/ {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; connect-src 'self' http: https:; frame-src 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; child-src 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; img-src 'self' data: blob: http: https:; font-src 'self' data: http: https:; script-src 'self' 'unsafe-inline' http: https:; style-src 'self' 'unsafe-inline' http: https:; script-src-attr 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "clipboard-read=*, clipboard-write=*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    rewrite ^ /index.html break;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
